<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title|default("MSPS - Maquiservicio Pérez SAS") }}</title>

    <link rel="stylesheet" href="/static/css/carrito.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/ajustes_interfaz.css?v=20261115c">
    {% block estilos_pagina %}{% endblock %}
    <link rel="stylesheet" href="/static/css/apariencia.css">
    <script src="/static/js/tema.js"></script>
</head>
<body>
    {% include "components/navbar.html" %}

    <main>
        {% block content %}{% endblock %}
    </main>
    <dialog id="aviso-correo" class="correo-dialogo" aria-labelledby="aviso-titulo">
        <h2 id="aviso-titulo">Revisa tu correo</h2>
        <p role="status"></p>
        <form method="dialog"><button class="auth-field--submit">Entendido</button></form>
    </dialog>

    {% include "components/footer.html" %}

    <script src="/static/js/main.js" defer></script>

    {% if sesion and sesion.tipo == 'administrador' %}
        <script src="/static/js/admin_maquinas.js?v=20261115c" defer></script>
    {% endif %}
</body>
</html>
