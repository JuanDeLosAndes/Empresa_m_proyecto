<div class="auth-panel" data-auth-panel="login" hidden>
    <button type="button" class="auth-panel__close" data-auth-close aria-label="Cerrar">&times;</button>

    <h3 class="auth-panel__title">Iniciar Sesión:</h3>
    <p class="auth-panel__subtitle">Ingresa tus credenciales para continuar...</p>

    <form class="auth-panel__form" action="/login" method="post">
        {% for field in login_fields %}
        <label class="auth-field">
            <span class="sr-only">{{ field.label }}</span>
            <input type="{{ field.type }}" name="{{ field.name }}" placeholder="{{ field.placeholder }}" autocomplete="off" required>
        </label>
        {% endfor %}
        <button type="submit" class="auth-field auth-field--submit">Ingresar</button>
    </form>

    <div class="auth-panel__links">
        <a href="#">¿Olvidaste tu contraseña?</a>
        <a href="#" data-auth-switch="register">¿No tienes cuenta?</a>
    </div>
</div>
